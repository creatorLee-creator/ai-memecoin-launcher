name: Generate Pump SDK lockfile (temporary)
on:
  push:
    branches: [feature/pump-sdk-runtime]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pump-sdk-runtime
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve pinned dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Lock official Pump SDK runtime dependencies"
            git push origin HEAD:feature/pump-sdk-runtime
          fi
